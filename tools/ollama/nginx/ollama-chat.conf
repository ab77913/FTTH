# Ollama Chat - office-only nginx example
#
# start_server.bat generates .runtime/nginx-office.conf automatically.
# This file is a readable reference if you want to manage nginx manually.
#
# Replace 172.16.0.0/12 with your office network range if it changes.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 120s;

    upstream flask_app {
        server 127.0.0.1:5100;
        keepalive 32;
    }

    server {
        listen 8082;
        server_name _;

        allow 127.0.0.1;
        allow 172.16.0.0/12;
        deny all;

        client_max_body_size 100M;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 60s;

        location / {
            proxy_pass http://flask_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-API-Key" always;

            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        location /uploads/ {
            alias C:/Users/Admin/Documents/ollama_launch/uploads/;
            expires 7d;
            add_header Cache-Control "public";
        }
    }
}
