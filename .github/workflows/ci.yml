name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Run production deploy job after image publish"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write

# CI uses safe placeholders only. Real production values belong in GitHub Secrets/Environments.
env:
  PYTHON_DEFAULT_VERSION: "3.11"
  IMAGE_NAME: ghcr.io/${{ github.repository }}/ftth-api
  DATABASE_URL: postgresql+psycopg2://ftth:ftth@127.0.0.1:5432/ftth
  REDIS_URL: redis://127.0.0.1:6379/0
  CELERY_BROKER_URL: redis://127.0.0.1:6379/1
  CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/2
  RABBITMQ_URL: amqp://ftth:ftth@127.0.0.1:5672/ftth
  JWT_SECRET_KEY: ci-test-secret-not-for-production-00000000
  FTTH_ENV: test
  FTTH_SSL_VERIFY: "0"
  FTTH_CORS_ORIGINS: http://localhost,http://127.0.0.1
  FTTH_ALLOW_LOCAL_DATABASE: "1"
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Ruff lint
        run: >-
          python -m ruff check
          backend tests api_server.py celery_worker.py
          scripts/emit_env_bat.py scripts/celery_dev_worker.py scripts/production_readiness_check.py

      - name: Syntax compile without writing pyc
        run: |
          python - <<'PY'
          from pathlib import Path
          targets = [Path('api_server.py'), Path('backend'), Path('scripts')]
          for target in targets:
              files = [target] if target.is_file() else sorted(target.rglob('*.py'))
              for path in files:
                  if any(part in {'vendor', '__pycache__'} for part in path.parts):
                      continue
                  compile(path.read_text(encoding='utf-8'), str(path), 'exec')
          print('syntax ok')
          PY

      - name: Production readiness audit
        run: python scripts/production_readiness_check.py

      - name: Static/frontend contract tests
        run: python -m pytest tests/test_static_frontend.py tests/test_production_readiness.py -q

  test:
    name: API and pipeline tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: ftth
          POSTGRES_PASSWORD: ftth
          POSTGRES_DB: ftth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ftth -d ftth"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: ftth
          RABBITMQ_DEFAULT_PASS: ftth
          RABBITMQ_DEFAULT_VHOST: ftth
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: API contract and health tests
        run: >-
          python -m pytest
          tests/test_api_contracts.py
          tests/test_api_workflow.py
          tests/test_auth_api.py
          tests/test_auth_rate_limit.py
          tests/test_health_endpoints.py
          tests/test_security_middleware.py
          tests/test_map_streetview_api.py
          -q --tb=short

      - name: Full test suite
        run: python -m pytest tests/ -q --tb=short

      - name: Upload pytest debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-debug-${{ matrix.python-version }}-${{ github.run_id }}
          path: |
            .pytest_cache
            logs
          if-no-files-found: ignore
          retention-days: 7

  security:
    name: Security audit
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_DEFAULT_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dependency vulnerability audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --desc --progress-spinner off

      - name: Secret scan with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker build and publish
    runs-on: ubuntu-latest
    needs: [quality, test]
    timeout-minutes: 30
    outputs:
      image: ${{ steps.meta.outputs.tags }}
      digest: ${{ steps.publish.outputs.digest || steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build image for PR/branch validation
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ftth-api:ci
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_DEFAULT_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image smoke test
        run: docker run --rm ftth-api:ci python -c "import api_server; print('api_server import ok')"

      - name: Login to GHCR
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        id: publish
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            PYTHON_VERSION=${{ env.PYTHON_DEFAULT_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: docker
    timeout-minutes: 20
    environment: production
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.deploy) || vars.AUTO_DEPLOY_PRODUCTION == 'true') }}
    steps:
      - name: Validate deployment secrets
        run: |
          test -n "${{ secrets.PROD_SSH_HOST }}"
          test -n "${{ secrets.PROD_SSH_USER }}"
          test -n "${{ secrets.PROD_SSH_KEY }}"
          test -n "${{ vars.PROD_APP_DIR }}"

      - name: Deploy over SSH
        env:
          PROD_SSH_HOST: ${{ secrets.PROD_SSH_HOST }}
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_APP_DIR: ${{ vars.PROD_APP_DIR }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$PROD_SSH_KEY" > ~/.ssh/ftth_deploy_key
          chmod 600 ~/.ssh/ftth_deploy_key
          ssh-keyscan -H "$PROD_SSH_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/ftth_deploy_key "$PROD_SSH_USER@$PROD_SSH_HOST" "cd '$PROD_APP_DIR' && docker compose pull && docker compose up -d && docker image prune -f"
