apiVersion: v1
kind: Secret
metadata:
  name: ftth-secrets
  namespace: ftth
  labels:
    app.kubernetes.io/name: ftth
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg2://ftth:replace-with-strong-password@ftth-postgres:5432/ftth
  JWT_SECRET_KEY: replace-with-at-least-32-random-characters
  RABBITMQ_URL: amqp://ftth:replace-with-strong-password@ftth-rabbitmq:5672/ftth
  RABBITMQ_DEFAULT_PASS: replace-with-strong-password
  GOOGLE_MAPS_API_KEY: ""
  GOOGLE_GEOCODING_API_KEY: ""
  GOOGLE_API_KEY: ""
  SMARTY_AUTH_ID: ""
  SMARTY_AUTH_TOKEN: ""
  MELISSA_LICENSE_KEY: ""
  AZURE_VISION_ENDPOINT: ""
  AZURE_VISION_KEY: ""
  AZURE_OPENAI_API_KEY: ""
  AZURE_OPENAI_ENDPOINT: ""
  AZURE_OPENAI_DEPLOYMENT: ""

