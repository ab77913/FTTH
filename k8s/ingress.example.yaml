apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ftth-api
  namespace: ftth
  labels:
    app.kubernetes.io/name: ftth
    app.kubernetes.io/component: api
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 100m
spec:
  ingressClassName: nginx
  rules:
    - host: ftth.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: ftth-api
                port:
                  name: http
  tls:
    - hosts:
        - ftth.example.com
      secretName: ftth-api-tls
