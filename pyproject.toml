[project]
name = "ftth-data-ingestion"
version = "0.1.0"
description = "FTTH Data Ingestion and Extraction Module"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [
    "backend/vendor",
    "scripts/dev",
    "tools",
    ".venv",
    ".venv311",
]

[tool.ruff.lint]
ignore = ["E402", "E701", "E702", "E722"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "backend"]



